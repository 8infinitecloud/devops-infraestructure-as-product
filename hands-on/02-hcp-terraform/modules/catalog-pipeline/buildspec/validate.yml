version: 0.2

# Valida y empaqueta TODOS los productos del catalogo.
#
# UNA sola pipeline los publica todos, asi que si la validacion de uno falla no
# se publica ninguno. Por eso no se corta en el primer error: recorre el catalogo
# entero y lista al final todo lo que esta roto. Enterarse de los tres fallos de
# una vez vale mas que arreglarlos de uno en uno.

env:
  shell: bash

phases:
  install:
    commands:
      - |
        set -euo pipefail
        curl -fsSL -o /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
        unzip -oq /tmp/terraform.zip -d /usr/local/bin
        terraform version

  build:
    commands:
      - |
        set -uo pipefail
        : "${PRODUCTS_JSON:?falta el catalogo}"

        SRC="${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}"
        echo "${SRC}" > "${CODEBUILD_SRC_DIR}/source_version.txt"
        printf '%s' "${PRODUCTS_JSON}" > "${CODEBUILD_SRC_DIR}/products.json"

        FALLOS=""
        for CLAVE in $(echo "${PRODUCTS_JSON}" | jq -r 'keys[]'); do
          RUTA="$(echo "${PRODUCTS_JSON}" | jq -r --arg k "${CLAVE}" '.[$k].ruta')"
          NOMBRE="$(echo "${PRODUCTS_JSON}" | jq -r --arg k "${CLAVE}" '.[$k].nombre')"

          echo
          echo "=================================================================="
          echo " ${NOMBRE}   (${RUTA})"
          echo "=================================================================="

          if [ ! -d "${RUTA}" ]; then
            echo "ERROR: no existe la ruta ${RUTA}" >&2
            FALLOS="${FALLOS} ${CLAVE}:ruta"
            continue
          fi

          (
            set -e
            cd "${RUTA}"
            echo "-- terraform fmt -check"
            terraform fmt -check -recursive -no-color
            echo "-- terraform init (sin backend)"
            terraform init -backend=false -input=false -no-color
            echo "-- terraform validate"
            terraform validate -no-color
          ) || { FALLOS="${FALLOS} ${CLAVE}:terraform"; continue; }

          TAR="${CODEBUILD_SRC_DIR}/${CLAVE}.tar.gz"
          echo "-- empaquetando ${CLAVE}.tar.gz"
          tar czf "${TAR}" \
              --exclude='.terraform' --exclude='.terraform.lock.hcl' --exclude='terraform.tfstate*' \
              -C "${RUTA}" .

          # El parameter parser exige los .tf en la RAIZ del tar. Si se empaqueta
          # la carpeta en vez de su contenido, el asistente sale sin campos y el
          # fallo no aparece hasta que un usuario intenta lanzarlo.
          if ! tar tzf "${TAR}" | grep -qE '^\./[^/]+\.tf$'; then
            echo "ERROR: no hay .tf en la raiz de ${CLAVE}.tar.gz" >&2
            FALLOS="${FALLOS} ${CLAVE}:estructura"
            continue
          fi
          tar tzf "${TAR}" | sed 's/^/     /'
        done

        echo
        echo "=================== RESUMEN ==================="
        if [ -n "${FALLOS}" ]; then
          echo "Productos con fallos:${FALLOS}"
          echo "No se publica NINGUNO: una sola pipeline sirve a todo el catalogo."
          exit 1
        fi
        echo "Todos los productos validan y estan empaquetados."

artifacts:
  files:
    - '*.tar.gz'
    - source_version.txt
    - products.json
  discard-paths: yes
