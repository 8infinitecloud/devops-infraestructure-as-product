version: 0.2

# Publica TODOS los productos del catalogo en Service Catalog.
#
# PRODUCT_TYPE decide a que motor van:
#   EXTERNAL        -> colas ServiceCatalogExternal*        (motor Terraform OS)
#   TERRAFORM_CLOUD -> colas ServiceCatalogTerraformCloud*  (motor HCP Terraform)
# AWS retiro TERRAFORM_OPEN_SOURCE el 2023-12-14 en favor de EXTERNAL.
#
# A diferencia de Validate, aqui NO se corta en el primer fallo. Validate ya
# garantizo que los artefactos estan bien; lo que puede fallar aqui es la API de
# AWS, y dejar sin publicar los productos 4 y 5 porque el 3 dio un error
# transitorio no ayuda a nadie. Se publica lo que se pueda y se sale con error.

env:
  shell: bash

phases:
  build:
    commands:
      - |
        set -uo pipefail
        : "${PORTFOLIO_ID:?}" "${LAUNCH_ROLE_ARN:?}" "${ARTIFACT_BUCKET:?}" "${PRODUCT_TYPE:?}"

        SRC="$(cat source_version.txt 2>/dev/null || echo manual)"
        VERSION="v$(date -u +%Y%m%d-%H%M%S)-${SRC:0:7}"
        CATALOGO="$(cat products.json)"

        FALLOS=""
        for CLAVE in $(echo "${CATALOGO}" | jq -r 'keys[]'); do
          NOMBRE="$(echo "${CATALOGO}" | jq -r --arg k "${CLAVE}" '.[$k].nombre')"
          DESC="$(echo "${CATALOGO}"   | jq -r --arg k "${CLAVE}" '.[$k].descripcion')"
          TAR="${CLAVE}.tar.gz"

          echo
          echo "=================================================================="
          echo " ${NOMBRE}"
          echo "=================================================================="

          if [ ! -f "${TAR}" ]; then
            echo "ERROR: falta el artefacto ${TAR}" >&2
            FALLOS="${FALLOS} ${CLAVE}"; continue
          fi

          SAFE="${NOMBRE// /-}"
          KEY="products/${SAFE}/${VERSION}.tar.gz"
          if ! aws s3 cp "${TAR}" "s3://${ARTIFACT_BUCKET}/${KEY}"; then
            FALLOS="${FALLOS} ${CLAVE}:s3"; continue
          fi
          URL="https://${ARTIFACT_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${KEY}"

          # El nombre es la CLAVE de busqueda: si cambia, se crea un producto
          # nuevo en vez de una version del que ya habia.
          PID="$(aws servicecatalog search-products-as-admin \
                   --portfolio-id "${PORTFOLIO_ID}" \
                   --query "ProductViewDetails[?ProductViewSummary.Name=='${NOMBRE}'].ProductViewSummary.ProductId | [0]" \
                   --output text 2>/dev/null || echo None)"

          PARAMS="{\"Name\":\"${VERSION}\",\"Description\":\"Commit ${SRC}\",\"Type\":\"${PRODUCT_TYPE}\",\"Info\":{\"LoadTemplateFromURL\":\"${URL}\"},\"DisableTemplateValidation\":true}"

          if [ "${PID}" = "None" ] || [ -z "${PID}" ]; then
            echo "-- no existe: lo creo con esta primera version"
            PID="$(aws servicecatalog create-product \
                     --name "${NOMBRE}" --owner "${PRODUCT_OWNER}" --description "${DESC}" \
                     --product-type "${PRODUCT_TYPE}" \
                     --provisioning-artifact-parameters "${PARAMS}" \
                     --query 'ProductViewDetail.ProductViewSummary.ProductId' --output text)" \
              || { FALLOS="${FALLOS} ${CLAVE}:create"; continue; }
            echo "   producto ${PID}"
            aws servicecatalog associate-product-with-portfolio \
              --product-id "${PID}" --portfolio-id "${PORTFOLIO_ID}" \
              || { FALLOS="${FALLOS} ${CLAVE}:associate"; continue; }
          else
            echo "-- existe ${PID}: anado la version ${VERSION}"
            aws servicecatalog create-provisioning-artifact \
              --product-id "${PID}" --parameters "${PARAMS}" \
              --query 'ProvisioningArtifactDetail.Id' --output text \
              || { FALLOS="${FALLOS} ${CLAVE}:version"; continue; }
          fi

          # Sin Launch Constraint, Service Catalog intenta aprovisionar con los
          # permisos de quien pulsa Launch: justo lo que el catalogo evita.
          EXISTE="$(aws servicecatalog list-constraints-for-portfolio \
                      --portfolio-id "${PORTFOLIO_ID}" --product-id "${PID}" \
                      --query "ConstraintDetails[?Type=='LAUNCH'] | [0].ConstraintId" \
                      --output text 2>/dev/null || echo None)"
          if [ "${EXISTE}" = "None" ] || [ -z "${EXISTE}" ]; then
            aws servicecatalog create-constraint \
              --portfolio-id "${PORTFOLIO_ID}" --product-id "${PID}" --type LAUNCH \
              --parameters "{\"RoleArn\":\"${LAUNCH_ROLE_ARN}\"}" \
              --query 'ConstraintDetail.ConstraintId' --output text \
              && echo "   launch constraint creado" \
              || FALLOS="${FALLOS} ${CLAVE}:constraint"
          fi

          echo "   version   ${VERSION}"
          echo "   artefacto ${URL}"
        done

        echo
        echo "=================== RESUMEN ==================="
        echo "Version publicada: ${VERSION}"
        if [ -n "${FALLOS}" ]; then
          echo "Con fallos:${FALLOS}"
          exit 1
        fi
        echo "Todos los productos publicados."
