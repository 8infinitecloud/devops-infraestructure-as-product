# Despliega los hands-on del taller en una cuenta de AWS desde la pestana Actions.
#
# Es la version en CI de scripts/bootstrap.sh y hace los mismos pasos en el mismo
# orden. Cambian dos cosas, y las dos por el mismo motivo —el runner es efimero:
#
#   Credenciales  vienen de los secrets del repositorio, no del entorno
#   State         se guarda en S3, no en un fichero local
#
# CONFIGURACION, una vez (Settings -> Secrets and variables -> Actions):
#
#   Secrets   AWS_ACCESS_KEY_ID       obligatorio
#             AWS_SECRET_ACCESS_KEY   obligatorio
#             TFE_TOKEN               solo para el hands-on 02
#
#   Variables AWS_REGION              opcional, por defecto us-east-1
#             TF_STATE_BUCKET         opcional, se deriva de la cuenta si falta
#             CODECONNECTIONS_ARN     opcional, una conexion ya autorizada
#             TFC_ORGANIZATION        solo para el hands-on 02
#
# Sobre las claves: son credenciales de larga duracion. El usuario IAM que las
# emite deberia existir solo para esto, y conviene borrarlas al acabar el taller.
# La alternativa sin claves es OIDC, que exige crear antes un rol de confianza.

name: Desplegar en AWS

on:
  workflow_dispatch:
    inputs:
      hands_on:
        description: Que motor desplegar
        type: choice
        required: true
        default: '01'
        options:
          - '01'
          - '02'
      accion:
        description: Que hacer
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]
      confirmacion:
        description: 'Solo para DESTROY: escribe DESTRUIR'
        type: string
        required: false
        default: ''

concurrency:
  # Dos applies a la vez sobre el mismo state es la forma mas rapida de
  # corromperlo. El bloqueo de DynamoDB lo evitaria, pero fallando: mejor encolar.
  group: deploy-${{ inputs.hands_on }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    name: ${{ inputs.accion }} — hands-on ${{ inputs.hands_on }}
    runs-on: ubuntu-latest

    env:
      # La misma version que la pipeline y que scripts/bootstrap.sh. Un state
      # escrito por una version mas nueva ya no lo puede abrir una mas vieja.
      TF_VERSION: '1.5.7'
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DIR: ${{ inputs.hands_on == '01' && 'hands-on/01-terraform-os' || 'hands-on/02-hcp-terraform' }}
      BUILD_DIR: ${{ inputs.hands_on == '01' && 'modules/terraform-os-engine/lambda-functions' || 'modules/hcp-terraform-engine/engine/lambda-functions' }}

    steps:
      # --- Guardas, antes de tocar nada -------------------------------------

      - name: Comprobar la confirmacion del destroy
        if: inputs.accion == 'destroy'
        run: |
          if [ "${{ inputs.confirmacion }}" != "DESTRUIR" ]; then
            echo "::error::Para destruir hay que escribir DESTRUIR en el campo de confirmacion."
            exit 1
          fi
          echo "::warning::ANTES de esto hay que TERMINAR los productos aprovisionados desde"
          echo "::warning::Service Catalog. Si se destruye el motor primero, no queda nada capaz"
          echo "::warning::de ejecutar su destroy y los recursos se quedan huerfanos en la cuenta."

      - name: Comprobar que estan las credenciales
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TFE: ${{ secrets.TFE_TOKEN }}
        run: |
          set -euo pipefail
          falta=""
          [ -n "${KEY_ID}" ]     || falta="${falta} AWS_ACCESS_KEY_ID"
          [ -n "${KEY_SECRET}" ] || falta="${falta} AWS_SECRET_ACCESS_KEY"
          if [ "${{ inputs.hands_on }}" = "02" ] && [ -z "${TFE}" ]; then
            falta="${falta} TFE_TOKEN"
          fi
          if [ -n "${falta}" ]; then
            echo "::error::Faltan secrets del repositorio:${falta}"
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "Credenciales presentes."

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Quien soy en AWS
        run: aws sts get-caller-identity

      # --- Empaquetado -------------------------------------------------------

      - uses: actions/setup-go@v5
        with:
          # La version sale del go.mod de cada motor: son distintas.
          go-version-file: ${{ inputs.hands_on == '01' && 'modules/terraform-os-engine/lambda-functions/terraform_open_source_parameter_parser/go.mod' || 'modules/hcp-terraform-engine/engine/lambda-functions/go.mod' }}

      - uses: actions/setup-python@v5
        if: inputs.hands_on == '01'
        with:
          python-version: '3.12'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Terraform no compila nada: archive_file lee los artefactos en tiempo de
      # plan. Sin esto el plan falla con la precondicion del modulo.
      - name: Empaquetar las Lambdas
        if: inputs.accion != 'destroy'
        run: make bin
        working-directory: ${{ env.BUILD_DIR }}

      # El binario Go declara x86_64 en la Lambda. Si sale ARM, el deploy
      # funciona y la funcion revienta al invocarse.
      - name: Verificar la arquitectura del binario Go
        if: inputs.accion != 'destroy' && inputs.hands_on == '01'
        run: make verify
        working-directory: ${{ env.BUILD_DIR }}

      # --- State remoto ------------------------------------------------------

      - name: Preparar el state remoto
        id: state
        run: |
          set -euo pipefail
          cuenta="$(aws sts get-caller-identity --query Account --output text)"
          bucket="${{ vars.TF_STATE_BUCKET }}"
          [ -n "${bucket}" ] || bucket="aurex-tfstate-${cuenta}-${AWS_REGION}"
          tabla="aurex-tfstate-lock-${AWS_REGION}"

          # UNICA cosa que no crea Terraform en todo el repo, y no por gusto:
          # es el sitio donde Terraform guarda su propio state, asi que no puede
          # crearlo el mismo. Idempotente: si ya existen, no hace nada.
          if ! aws s3api head-bucket --bucket "${bucket}" 2>/dev/null; then
            echo "Creando ${bucket}"
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${bucket}" --region us-east-1
            else
              aws s3api create-bucket --bucket "${bucket}" --region "${AWS_REGION}" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
            fi
            # Un state corrupto se recupera de la version anterior. No es opcional.
            aws s3api put-bucket-versioning --bucket "${bucket}" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "${bucket}" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "${bucket}" \
              --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
          fi

          # Terraform 1.5 bloquea con DynamoDB; el bloqueo nativo en S3 llego en
          # la 1.10, y aqui la version esta fijada.
          if ! aws dynamodb describe-table --table-name "${tabla}" >/dev/null 2>&1; then
            echo "Creando ${tabla}"
            aws dynamodb create-table --table-name "${tabla}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST >/dev/null
            aws dynamodb wait table-exists --table-name "${tabla}"
          fi

          echo "bucket=${bucket}" >> "${GITHUB_OUTPUT}"
          echo "tabla=${tabla}"   >> "${GITHUB_OUTPUT}"

      - name: Declarar el backend
        run: |
          set -euo pipefail
          # Se escribe aqui y no en el repo porque Terraform no admite backends
          # condicionales: uno fijo obligaria a quien despliega desde CloudShell,
          # que va con state local, a configurarlo.
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
        working-directory: ${{ env.DIR }}

      - name: terraform init
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=aurex/hands-on-${{ inputs.hands_on }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ steps.state.outputs.tabla }}" \
            -backend-config="encrypt=true"
        working-directory: ${{ env.DIR }}

      # --- Terraform ---------------------------------------------------------

      - name: terraform ${{ inputs.accion }}
        env:
          # Sin fichero de variables: la configuracion viaja por entorno.
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_github_repository_id: ${{ github.repository }}
          TF_VAR_github_branch: ${{ github.ref_name }}
          TF_VAR_existing_connection_arn: ${{ vars.CODECONNECTIONS_ARN }}
          TF_VAR_tfc_organization: ${{ vars.TFC_ORGANIZATION }}
          TF_VAR_infracost_api_key_secret_arn: ${{ vars.INFRACOST_SECRET_ARN }}
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ inputs.accion }}" in
            plan)    terraform plan    -input=false -no-color ;;
            apply)   terraform apply   -input=false -no-color -auto-approve ;;
            destroy) terraform destroy -input=false -no-color -auto-approve ;;
          esac
        working-directory: ${{ env.DIR }}

      - name: Resumen
        if: always() && inputs.accion == 'apply'
        run: |
          set -uo pipefail
          {
            echo "## Hands-on ${{ inputs.hands_on }} — ${{ job.status }}"
            echo
            echo '```'
            terraform output -no-color 2>/dev/null || echo "(sin outputs)"
            echo '```'
            if [ "$(terraform output -raw connection_needs_authorization 2>/dev/null || echo false)" = "true" ]; then
              echo
              echo "### Falta un paso manual"
              echo
              echo "La conexion a GitHub nace en \`PENDING\`: el handshake OAuth no tiene API."
              echo "Hasta que se autorice, la pipeline no puede leer del repositorio."
              echo
              echo "Consola -> CodePipeline -> Settings -> Connections -> *Update pending connection*"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
        working-directory: ${{ env.DIR }}
