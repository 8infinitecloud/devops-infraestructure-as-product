# Dependabot vigila TODOS los ecosistemas que hay en el repo. Son cuatro, y es
# facil olvidar alguno: dos modulos Go con versiones distintas, las Lambdas
# Python, los propios workflows de Actions y los providers de Terraform.
version: 2

updates:
  # --- GitHub Actions -------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: [dependencias, ci]
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # --- Go: motor de HCP Terraform ------------------------------------------
  - package-ecosystem: gomod
    directory: /modules/hcp-terraform-engine/engine/lambda-functions
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(go)"
    labels: [dependencias, go]
    open-pull-requests-limit: 3
    groups:
      # Un solo PR por tanda. Sin esto, el SDK de AWS solo ya son diez PRs, y
      # ademas no tiene sentido revisarlos por separado: o compila el conjunto
      # o no compila.
      go:
        patterns: ["*"]

  # --- Go: parser de parametros de Terraform OS ----------------------------
  - package-ecosystem: gomod
    directory: /modules/terraform-os-engine/lambda-functions/terraform_open_source_parameter_parser
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(go)"
    labels: [dependencias, go]
    open-pull-requests-limit: 3
    groups:
      go:
        patterns: ["*"]

  # --- Python: Lambdas del motor Terraform OS ------------------------------
  - package-ecosystem: pip
    directory: /modules/terraform-os-engine/lambda-functions/state_machine_lambdas
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(py)"
    labels: [dependencias, python]
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /modules/terraform-os-engine/lambda-functions/provisioning-operations-handler
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(py)"
    labels: [dependencias, python]
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]

  # --- Terraform: providers de cada modulo y de cada hands-on --------------
  # `directories` (plural) evita repetir un bloque por carpeta.
  - package-ecosystem: terraform
    directories:
      - /modules/catalog-bootstrap-hcp-terraform
      - /modules/catalog-bootstrap-terraform-os
      - /modules/catalog-pipeline
      - /modules/hcp-terraform-engine
      - /modules/terraform-os-engine
      - /hands-on/01-terraform-os
      - /hands-on/02-hcp-terraform
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(tf)"
    labels: [dependencias, terraform]
    open-pull-requests-limit: 3
    groups:
      # El repo acota aws al major 5 a proposito, para que los dos hands-on usen
      # la misma familia. Agrupar evita siete PRs por cada patch del provider.
      providers:
        patterns: ["*"]
