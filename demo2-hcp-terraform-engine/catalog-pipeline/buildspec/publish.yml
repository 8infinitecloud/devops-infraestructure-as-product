version: 0.2
env:
  shell: bash
phases:
  build:
    commands:
      - |
        set -euo pipefail
        # Demo 2: el producto se publica como TERRAFORM_CLOUD. Ese tipo enruta a las
        # colas ServiceCatalogTerraformCloud*OperationQueue del motor de HashiCorp, y
        # es el que consume su terraform-parameter-parser. El apply lo ejecuta un
        # workspace de HCP Terraform, no un contenedor en esta cuenta.
        SRC_VERSION="$(cat source_version.txt 2>/dev/null || echo manual)"
        VERSION="v$(date -u +%Y%m%d-%H%M%S)-${SRC_VERSION:0:7}"
        SAFE_NAME="${PRODUCT_NAME// /-}"
        KEY="products/${SAFE_NAME}/${VERSION}.tar.gz"

        echo "== Subiendo artefacto a s3://${ARTIFACT_BUCKET}/${KEY} =="
        aws s3 cp product.tar.gz "s3://${ARTIFACT_BUCKET}/${KEY}"
        ARTIFACT_URL="https://${ARTIFACT_BUCKET}.s3.${AWS_REGION}.amazonaws.com/${KEY}"

        echo "== Buscando el producto '${PRODUCT_NAME}' en el portfolio ${PORTFOLIO_ID} =="
        PRODUCT_ID="$(aws servicecatalog search-products-as-admin \
            --portfolio-id "${PORTFOLIO_ID}" \
            --query "ProductViewDetails[?ProductViewSummary.Name=='${PRODUCT_NAME}'].ProductViewSummary.ProductId | [0]" \
            --output text 2>/dev/null || echo None)"

        if [ "${PRODUCT_ID}" = "None" ] || [ -z "${PRODUCT_ID}" ]; then
          echo "== El producto no existe: lo creo con esta primera version =="
          PRODUCT_ID="$(aws servicecatalog create-product \
            --name "${PRODUCT_NAME}" \
            --owner "${PRODUCT_OWNER}" \
            --description "Red, almacenamiento y rol de acceso estandar. Publicado por CodePipeline." \
            --product-type TERRAFORM_CLOUD \
            --provisioning-artifact-parameters \
              "{\"Name\":\"${VERSION}\",\"Description\":\"Commit ${SRC_VERSION}\",\"Type\":\"TERRAFORM_CLOUD\",\"Info\":{\"LoadTemplateFromURL\":\"${ARTIFACT_URL}\"},\"DisableTemplateValidation\":true}" \
            --query 'ProductViewDetail.ProductViewSummary.ProductId' --output text)"
          echo "Producto creado: ${PRODUCT_ID}"

          echo "== Asociando el producto al portfolio =="
          aws servicecatalog associate-product-with-portfolio \
            --product-id "${PRODUCT_ID}" --portfolio-id "${PORTFOLIO_ID}"
        else
          echo "== Producto existente ${PRODUCT_ID}: anado la version ${VERSION} =="
          aws servicecatalog create-provisioning-artifact \
            --product-id "${PRODUCT_ID}" \
            --parameters "{\"Name\":\"${VERSION}\",\"Description\":\"Commit ${SRC_VERSION}\",\"Type\":\"TERRAFORM_CLOUD\",\"Info\":{\"LoadTemplateFromURL\":\"${ARTIFACT_URL}\"},\"DisableTemplateValidation\":true}" \
            --query 'ProvisioningArtifactDetail.Id' --output text
        fi

        echo "== Asegurando el Launch Constraint =="
        EXISTING="$(aws servicecatalog list-constraints-for-portfolio \
            --portfolio-id "${PORTFOLIO_ID}" --product-id "${PRODUCT_ID}" \
            --query "ConstraintDetails[?Type=='LAUNCH'] | [0].ConstraintId" --output text 2>/dev/null || echo None)"
        if [ "${EXISTING}" = "None" ] || [ -z "${EXISTING}" ]; then
          aws servicecatalog create-constraint \
            --portfolio-id "${PORTFOLIO_ID}" --product-id "${PRODUCT_ID}" \
            --type LAUNCH \
            --parameters "{\"RoleArn\":\"${LAUNCH_ROLE_ARN}\"}" \
            --query 'ConstraintDetail.ConstraintId' --output text
          echo "Launch Constraint creado"
        else
          echo "Launch Constraint ya existente: ${EXISTING}"
        fi

        echo
        echo "=========================================="
        echo " Producto : ${PRODUCT_NAME} (${PRODUCT_ID})"
        echo " Version  : ${VERSION}"
        echo " Artefacto: ${ARTIFACT_URL}"
        echo "=========================================="
