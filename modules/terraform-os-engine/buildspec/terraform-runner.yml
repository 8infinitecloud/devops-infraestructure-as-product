version: 0.2
env:
  shell: bash
phases:
  install:
    commands:
      - |
        set -euo pipefail
        echo "== Instalando Terraform ${TF_VERSION} =="
        curl -fsSL -o /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
        unzip -oq /tmp/terraform.zip -d /usr/local/bin
        chmod +x /usr/local/bin/terraform
        terraform version
        command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq jq; }
        # Infracost es OPCIONAL y NUNCA debe tumbar un aprovisionamiento.
        # Aqui hay set -e activo, asi que todo va dentro de condiciones: un fallo
        # en la condicion de un `if` no dispara set -e.
        if [ -n "${INFRACOST_API_KEY:-}" ]; then
          INFRACOST_V=0.10.45
          if curl -sSL --max-time 90 "https://github.com/infracost/infracost/releases/download/v${INFRACOST_V}/infracost-linux-amd64.tar.gz" -o /tmp/ic.tgz \
             && tar -xzf /tmp/ic.tgz -C /tmp \
             && mv /tmp/infracost-linux-amd64 /usr/local/bin/infracost \
             && chmod +x /usr/local/bin/infracost; then
            infracost --version || true
          else
            echo "AVISO: no se pudo instalar infracost. Se continua SIN estimacion de coste."
          fi
        else
          echo "infracost: omitido (sin INFRACOST_API_KEY)."
        fi
  build:
    commands:
      - |
        set -euo pipefail

        : "${ACTION:?}" "${PP_DESCRIPTOR:?}" "${LAUNCH_ROLE_ARN:?}" "${TF_STATE_BUCKET:?}"
        export AWS_DEFAULT_REGION="${AWS_REGION}"

        # Normalizar los JSON opcionales que inyecta la Step Function
        [ -z "${TRACER_TAG_JSON:-}" ] && TRACER_TAG_JSON='{}'
        [ -z "${TAGS_JSON:-}" ] && TAGS_JSON='[]'
        [ -z "${ARTIFACT_PARAMETERS:-}" ] && ARTIFACT_PARAMETERS='[]'

        WORKSPACE_DIR="/tmp/workspaces/${PP_DESCRIPTOR}"
        rm -rf "${WORKSPACE_DIR}"
        mkdir -p "${WORKSPACE_DIR}"
        cd "${WORKSPACE_DIR}"
        echo "== Workspace: ${WORKSPACE_DIR} | accion: ${ACTION} =="

        # --- backend_override.tf.json ---------------------------------
        jq -n --arg b "${TF_STATE_BUCKET}" --arg k "${PP_DESCRIPTOR}" --arg r "${AWS_REGION}" \
          '{terraform:{backend:{s3:{bucket:$b,key:$k,region:$r}}}}' \
          > backend_override.tf.json

        # --- provider_override.tf.json --------------------------------
        # session_name: primeros 64 caracteres del descriptor, con '/' -> '-'
        SESSION_NAME="$(printf '%s' "${PP_DESCRIPTOR:0:64}" | tr '/' '-')"
        ALL_TAGS="$(jq -n --argjson t "${TRACER_TAG_JSON}" --argjson g "${TAGS_JSON}" \
          'if ($t|length)>0 then [$t]+$g else $g end')"
        jq -n --arg r "${AWS_REGION}" --arg role "${LAUNCH_ROLE_ARN}" --arg sn "${SESSION_NAME}" \
           --argjson tags "${ALL_TAGS}" \
          '{provider:{aws:{region:$r,
                           assume_role:{role_arn:$role,session_name:$sn},
                           default_tags:{tags:(($tags|map({(.key):.value})|add) // {})}}}}' \
          > provider_override.tf.json

        if [ "${ACTION}" = "apply" ]; then
          : "${ARTIFACT_PATH:?}"
          echo "== Descargando artefacto ${ARTIFACT_PATH} con el launch role =="
          # Service Catalog entrega la ruta como "S3://bucket/key", con el esquema en
          # MAYUSCULAS. "aws s3 cp" solo acepta "s3://", asi que se separan bucket y key
          # a mano, igual que hacia artifact_manager.download_artifact:
          #   bucket = artifact_path.split("/")[2]
          #   key    = artifact_path.split("/", 3)[3]
          ARTIFACT_NO_SCHEME="${ARTIFACT_PATH#*://}"
          ARTIFACT_BUCKET="${ARTIFACT_NO_SCHEME%%/*}"
          ARTIFACT_KEY="${ARTIFACT_NO_SCHEME#*/}"
          echo "   bucket=${ARTIFACT_BUCKET}"

          CREDS="$(aws sts assume-role --role-arn "${LAUNCH_ROLE_ARN}" \
                    --role-session-name TerraformLaunchRole --query Credentials --output json)"
          AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"${CREDS}")" \
          AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"${CREDS}")" \
          AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"${CREDS}")" \
            aws s3api get-object --bucket "${ARTIFACT_BUCKET}" --key "${ARTIFACT_KEY}" \
              "${WORKSPACE_DIR}/artifact.local" > /dev/null
          unset CREDS

          tar -xf artifact.local -C "${WORKSPACE_DIR}"
          rm -f artifact.local
          if ! compgen -G "${WORKSPACE_DIR}/*.tf" > /dev/null; then
            echo "No .tf files found. Nothing to parse. Make sure the root directory of the Terraform open source configuration file contains the .tf files for the root module." >&2
            exit 1
          fi

          # --- variable_override.tf.json ------------------------------
          if [ "$(jq 'length' <<<"${ARTIFACT_PARAMETERS}")" -gt 0 ]; then
            jq -n --argjson p "${ARTIFACT_PARAMETERS}" \
              '{variable: ($p | map({(.key): {default: ((.value|fromjson?) // .value)}}) | add)}' \
              > variable_override.tf.json
          fi
        fi

        echo "== Overrides generados =="
        for f in backend_override.tf.json provider_override.tf.json variable_override.tf.json; do
          [ -f "$f" ] && { echo "--- $f"; jq . "$f"; }
        done

        terraform init -no-color
        terraform validate -no-color

        if [ "${ACTION}" = "destroy" ]; then
          terraform destroy -auto-approve -no-color
          exit 0
        fi

        # --- Plan primero -------------------------------------------------------
        # Se aplica el plan GUARDADO, no un apply suelto: asi lo que se estima de
        # coste es exactamente lo que se despliega.
        terraform plan -out=tfplan -input=false -compact-warnings -no-color

        # --- Puerta de coste sobre el plan REAL ---------------------------------
        # A diferencia de la pipeline, aqui ya existen los parametros que eligio el
        # usuario final. Es el unico sitio donde el coste se puede gobernar de verdad.
        # Lo UNICO que puede abortar aqui es un presupuesto excedido de verdad.
        # Ni la instalacion, ni la API, ni el parseo del JSON pueden hacerlo.
        MONTHLY=""
        LIMIT="${INFRACOST_MAX_MONTHLY_USD:-0}"

        if [ -n "${INFRACOST_API_KEY:-}" ] && command -v infracost >/dev/null 2>&1; then
          if terraform show -json tfplan > tfplan.json 2>/dev/null \
             && infracost breakdown --path tfplan.json --format json --out-file infracost.json >/dev/null 2>&1; then
            MONTHLY="$(jq -r '.totalMonthlyCost // "0"' infracost.json 2>/dev/null || echo "")"
            infracost breakdown --path tfplan.json --format table 2>/dev/null || true
          else
            echo "AVISO: la estimacion de coste fallo (API key, cuota o red). Se continua."
          fi
        fi

        # Solo se compara si se obtuvo un numero. Si no, no se bloquea a ciegas.
        if printf '%s' "${MONTHLY}" | grep -Eq '^[0-9]+([.][0-9]+)?$'; then
          echo "== Coste mensual estimado: USD ${MONTHLY} =="
          if [ "${LIMIT}" != "0" ]; then
            if awk "BEGIN{exit !(${MONTHLY} > ${LIMIT})}"; then
              echo "PRESUPUESTO EXCEDIDO: USD ${MONTHLY}/mes supera el limite de USD ${LIMIT}/mes." >&2
              echo "Se detiene antes de crear ningun recurso." >&2
              exit 1
            fi
            echo "   Dentro del limite de USD ${LIMIT}/mes."
          else
            echo "   (advisory: INFRACOST_MAX_MONTHLY_USD=0, no bloquea)"
          fi
        elif [ "${LIMIT}" != "0" ]; then
          # FAIL-OPEN deliberado: hay limite pero no hay estimacion.
          # Se elige continuar para que una caida de Infracost no bloquee el
          # catalogo. El coste es que la puerta se puede eludir rompiendo la
          # herramienta, por eso el aviso es ruidoso y queda en el log del build.
          echo "AVISO: hay limite de presupuesto (USD ${LIMIT}/mes) pero NO se pudo estimar el coste."
          echo "       Se continua con el apply: la puerta de coste NO se aplica en esta ejecucion."
        fi

        terraform apply -input=false -compact-warnings -no-color tfplan
  post_build:
    commands:
      - rm -rf "/tmp/workspaces/${PP_DESCRIPTOR}" || true
